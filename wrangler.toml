name = "gantt-share"
main = "workers/share-worker.js"
compatibility_date = "2026-07-28"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

# §M2：目标项目（仓库 / 默认分支 / 命令 / 交付配置）已搬进 D1 的 `feedback_projects`
# 单行数据，见 migrations/0006。改目标不再需要改配置并重新部署。
#
# 已删除：
#   FEEDBACK_GITHUB_REPOSITORY / FEEDBACK_GITHUB_REF —— 迁进 feedback_projects
#   FEEDBACK_GITHUB_WORKFLOW   —— 死配置。代码里一次都没读过；派发用的是
#                                 FEEDBACK_PROVIDER_WORKFLOW_FILES 那张 provider→文件映射。
#   FEEDBACK_GITHUB_API_VERSION（2026-08-23 删）—— 死配置，且值是错的。全仓只有这一行，
#                                 四处 GitHub 调用写的都是硬编码 'X-GitHub-Api-Version:
#                                 2022-11-28'，跟这里声明的 "2026-03-10" 对不上。
#
# 刻意保留在这里的：
#   FEEDBACK_PRODUCTION_ORIGIN —— 被同步的 getFeedbackPublicOrigin(request, env) 在请求
#   路径上读取，而 Pages 与 Worker 跑同一份 share-worker.js、Pages 侧没有 D1 绑定。
#   把它挪进表会让同一份代码在两种部署下行为分叉，且要把一个同步函数改成 async。
#   配置归属按「谁需要读它」划分：派发路径进表，同源渲染判定留 vars。
#
# ✅ 2026-08-19 19:36：0005/0006/0007 已 apply 到生产 D1，本约束已结清。
#    （原约束：先 apply 0006 再部署本文件，否则派发拿不到仓库名。本次实际顺序反了，
#     Worker 13:40 先上、迁移 19:36 才 apply，窗口内无流量，未造成影响。）
[vars]
FEEDBACK_CALLBACK_ORIGIN = "https://gantt-share.ch451314.workers.dev"
# FEEDBACK_PRODUCTION_API_URL 在 Worker 里只被 §19.5 预检的 production_smoke 存在性检查
# 读到（`has(...)`），删了预检就永远过不去；真正拿它当 URL 用的是 Actions 工作流里的
# 同名 repo variable。
FEEDBACK_PRODUCTION_API_URL = "https://gantt-share.ch451314.workers.dev"
FEEDBACK_PRODUCTION_ORIGIN = "https://gantt-task-editor.pages.dev"

# Spec §13.4/§17.2: the single low-frequency `feedback-reconcile` sweep. Issue
# processing is event-driven (§4), so there is deliberately no high-frequency
# cron here — see SCN-FWB-002.
[triggers]
crons = ["0 3 * * *"]

[[kv_namespaces]]
binding = "SHARE_KV"
id = "7d9a0ab283ec48b7b9f106d0175b3f01"
preview_id = "fcfc0a97ee1046aaaaa66de0059f22b5"

# FEEDBACK_KV（2026-08-23 解绑）—— 命名空间 6f5d4a8a… 里 0 个 key。它只被
# getFeedbackStore(env) 的 `env.FEEDBACK_KV || env.SHARE_KV` 读到，四个调用点全是
# legacy 回填的 store.get，没有任何 put/delete。解绑后回退到 SHARE_KV，那边 feedback:*
# 前缀同样是 0 个 key，两边都 miss，行为不变。命名空间本身保留未删。

[[durable_objects.bindings]]
name = "CLOUD_DOCS"
class_name = "CloudDocDurableObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["CloudDocDurableObject"]

[[d1_databases]]
binding = "FEEDBACK_DB"
database_name = "gantt-feedback"
database_id = "477e9132-6280-4bf9-8dff-3479b2d7e0e9"
migrations_dir = "src/features/feedback/migrations"

[[r2_buckets]]
binding = "FEEDBACK_ARTIFACTS"
bucket_name = "gantt-feedback-artifacts"
preview_bucket_name = "gantt-feedback-artifacts-dev"

[[workflows]]
name = "feedback-workflow"
binding = "FEEDBACK_WORKFLOW"
class_name = "FeedbackWorkflow"
