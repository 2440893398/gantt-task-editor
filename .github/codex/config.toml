default_permissions = ":read-only"

[permissions.feedback-workspace]
description = "Feedback Agent workspace edits with protected control-plane paths."
extends = ":workspace"

[permissions.feedback-workspace.filesystem]
glob_scan_max_depth = 6

[permissions.feedback-workspace.filesystem.":workspace_roots"]
".github" = "read"
"AGENTS.md" = "read"
"scripts" = "read"
"wrangler.toml" = "read"
"wrangler.jsonc" = "read"
".agents" = "read"
".codex" = "read"
"tests/e2e/agent-journeys/expected" = "read"
"**/*.env" = "deny"
"**/*.pem" = "deny"
"**/*.key" = "deny"

[permissions.feedback-workspace.network]
enabled = false
