# Feedback Workbench V2 - Codex Agent runner (spec section 13.3).
#
# The Agent job is untrusted and never receives Candidate publication credentials.
# A fresh runner independently validates and publishes the resulting patch.
name: feedback-agent-codex

on:
    workflow_dispatch:
        inputs:
            payload:
                description: JSON dispatch payload issued by the feedback workbench
                required: true
                type: string

permissions:
    contents: read

concurrency:
    group: feedback-agent-${{ fromJSON(inputs.payload).runId }}
    cancel-in-progress: true

jobs:
    agent:
        runs-on: ubuntu-latest
        timeout-minutes: 60
        outputs:
            targeted_tests_outcome: ${{ steps.tests.outcome }}
            build_outcome: ${{ steps.build.outcome }}
            playwright_outcome: ${{ steps.playwright.outcome }}
        steps:
            - name: Validate dispatch payload
              id: payload
              env:
                  FEEDBACK_CALLBACK_ORIGIN: ${{ vars.FEEDBACK_CALLBACK_ORIGIN }}
              run: |
                  set -euo pipefail
                  node - <<'NODE'
                    const fs = require("fs");
                    const event = JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, "utf8"));
                    const payload = JSON.parse(event.inputs?.payload || "");
                    const required = ["issueId", "runId", "policy", "provider", "contextToken", "callbackToken"];
                    for (const key of required) {
                      if (!payload[key]) throw new Error(`missing ${key}`);
                    }
                    if (payload.provider !== "codex") throw new Error("wrong provider for this workflow");
                    if (!/^run_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(payload.runId)) {
                      throw new Error("invalid runId");
                    }
                    const tokenPattern = /^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$/;
                    if (!tokenPattern.test(payload.contextToken) || !tokenPattern.test(payload.callbackToken)) {
                      throw new Error("invalid scoped token");
                    }
                    console.log(`::add-mask::${payload.contextToken}`);
                    console.log(`::add-mask::${payload.callbackToken}`);
                    const allowed = ["analyze", "implement", "implement_and_verify", "review"];
                    if (!allowed.includes(payload.policy)) throw new Error(`unroutable policy ${payload.policy}`);
                    const deliveryMode = payload.deliveryMode || "candidate_review";
                    if (!["auto_deliver", "candidate_review", "no_delivery"].includes(deliveryMode)) {
                      throw new Error("invalid deliveryMode");
                    }
                    const callbackOrigin = String(process.env.FEEDBACK_CALLBACK_ORIGIN || "").replace(/\/+$/, "");
                    const parsedOrigin = new URL(callbackOrigin);
                    if (parsedOrigin.protocol !== "https:" || parsedOrigin.origin !== callbackOrigin) {
                      throw new Error("invalid trusted callback origin");
                    }
                    const baseCommit = payload.baseCommit || "";
                    if (baseCommit && !/^[0-9a-f]{40,64}$/i.test(baseCommit)) {
                      throw new Error("invalid baseCommit");
                    }
                    const writeAllowed = ["implement", "implement_and_verify"].includes(payload.policy);
                    if (writeAllowed && !baseCommit) throw new Error("write policy requires baseCommit");
                    const expectedProfile = writeAllowed ? "feedback-workspace" : "feedback-readonly";
                    if (payload.permissionProfile !== expectedProfile) {
                      throw new Error("permission profile does not match policy");
                    }
                    const responsesEndpoint = String(payload.responsesEndpoint || "");
                    const parsedEndpoint = new URL(responsesEndpoint);
                    if (!["http:", "https:"].includes(parsedEndpoint.protocol) || !parsedEndpoint.pathname.endsWith("/v1/responses")) {
                      throw new Error("invalid Responses API endpoint");
                    }
                    const encodedRunId = encodeURIComponent(payload.runId);
                    const out = {
                      runId: payload.runId,
                      policy: payload.policy,
                      deliveryMode,
                      contextUrl: `${callbackOrigin}/api/feedback/runs/${encodedRunId}/context`,
                      callbackUrl: `${callbackOrigin}/api/feedback/runs/${encodedRunId}/events`,
                      baseCommit,
                      baseRef: process.env.GITHUB_REF_NAME || "master",
                      candidateRef: `feedback/candidate/${payload.runId}`,
                      writeAllowed,
                      // §14.4 rule 4: server-owned authorization to record a
                      // scenario in `tests/scenarios/**`. The Runner never
                      // decides this for itself.
                      contractRun: payload.contractRun === true,
                      permissionProfile: writeAllowed ? "feedback-workspace" : ":read-only",
                      responsesEndpoint,
                    };
                    for (const [key, value] of Object.entries(out)) {
                      fs.appendFileSync(process.env.GITHUB_OUTPUT, `${key}=${value}\n`);
                    }
                  NODE

            - name: Checkout the pinned base commit
              uses: actions/checkout@v4
              with:
                  persist-credentials: false
                  fetch-depth: 0
                  ref: ${{ steps.payload.outputs.baseCommit || github.ref }}

            - name: Resolve trusted tool paths
              id: trusted_tools
              run: |
                  echo "node=$(command -v node)" >> "$GITHUB_OUTPUT"

            - name: Resolve base commit
              id: base
              run: echo "sha=$(/usr/bin/git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

            - name: Report run.started
              env:
                  CALLBACK_URL: ${{ steps.payload.outputs.callbackUrl }}
                  TRUSTED_NODE: ${{ steps.trusted_tools.outputs.node }}
              run: |
                  set -euo pipefail
                  FEEDBACK_CALLBACK_TOKEN="$("$TRUSTED_NODE" -e 'const event = JSON.parse(require("fs").readFileSync(process.env.GITHUB_EVENT_PATH, "utf8")); process.stdout.write(JSON.parse(event.inputs.payload).callbackToken);')"
                  echo "::add-mask::$FEEDBACK_CALLBACK_TOKEN"
                  /usr/bin/curl --fail-with-body --silent --show-error --max-time 20 \
                    -X POST "$CALLBACK_URL" \
                    -H "Authorization: Bearer $FEEDBACK_CALLBACK_TOKEN" \
                    -H 'Content-Type: application/json' \
                    -d "{\"eventId\":\"cb-started-${{ github.run_id }}-${{ github.run_attempt }}\",\"type\":\"run.started\",\"provider\":\"codex\"}"

            - name: Fetch the Issue context
              env:
                  CONTEXT_URL: ${{ steps.payload.outputs.contextUrl }}
                  PROMPT_PATH: ${{ runner.temp }}/feedback-prompt.md
                  TRUSTED_NODE: ${{ steps.trusted_tools.outputs.node }}
              run: |
                  set -euo pipefail
                  FEEDBACK_CONTEXT_TOKEN="$("$TRUSTED_NODE" -e 'const event = JSON.parse(require("fs").readFileSync(process.env.GITHUB_EVENT_PATH, "utf8")); process.stdout.write(JSON.parse(event.inputs.payload).contextToken);')"
                  echo "::add-mask::$FEEDBACK_CONTEXT_TOKEN"
                  /usr/bin/curl --fail-with-body --silent --show-error --max-time 20 \
                    "$CONTEXT_URL" -H "Authorization: Bearer $FEEDBACK_CONTEXT_TOKEN" \
                    -o "$RUNNER_TEMP/feedback-context.json"
                  # SCN-FWB-029: one prompt builder for both providers, so a
                  # read-only Run is never told to modify files and run tests.
                  "$TRUSTED_NODE" scripts/feedback-build-prompt.mjs \
                    --context "$RUNNER_TEMP/feedback-context.json" \
                    --out "$PROMPT_PATH"

            - name: Install dependencies
              if: steps.payload.outputs.writeAllowed == 'true'
              run: npm ci

            - name: Prepare Playwright dependencies
              if: steps.payload.outputs.policy == 'implement_and_verify'
              run: npx playwright install --with-deps chromium

            - name: Configure Codex permission profile
              env:
                  FEEDBACK_CODEX_HOME: ${{ runner.temp }}/feedback-codex-home
              run: |
                  set -euo pipefail
                  mkdir -p "$FEEDBACK_CODEX_HOME"
                  printf '%s\n' \
                    '[permissions.feedback-workspace]' \
                    'description = "Feedback Workbench repository-only implementation"' \
                    'extends = ":workspace"' \
                    > "$FEEDBACK_CODEX_HOME/config.toml"

            - name: Mark evidence collection start
              run: /usr/bin/touch "$RUNNER_TEMP/feedback-evidence-start"

            # SCN-FWB-030: a Run can spend 20+ minutes inside one step, and the
            # workbench used to show nothing between `run.started` and the
            # terminal — a person could not tell "still working" from "hung".
            # The token is re-extracted per step on purpose: putting it in
            # GITHUB_ENV would hand it to the untrusted Agent step as well.
            - name: Report phase (analysing)
              env:
                  CALLBACK_URL: ${{ steps.payload.outputs.callbackUrl }}
                  TRUSTED_NODE: ${{ steps.trusted_tools.outputs.node }}
                  WRITE_ALLOWED: ${{ steps.payload.outputs.writeAllowed }}
              run: |
                  set -euo pipefail
                  FEEDBACK_CALLBACK_TOKEN="$("$TRUSTED_NODE" -e 'const event = JSON.parse(require("fs").readFileSync(process.env.GITHUB_EVENT_PATH, "utf8")); process.stdout.write(JSON.parse(event.inputs.payload).callbackToken);')"
                  echo "::add-mask::$FEEDBACK_CALLBACK_TOKEN"
                  if [ "$WRITE_ALLOWED" = "true" ]; then PHASE=implementing; else PHASE=analyzing; fi
                  # Progress is never worth failing a Run over.
                  /usr/bin/curl --silent --show-error --max-time 10 \
                    -X POST "$CALLBACK_URL" \
                    -H "Authorization: Bearer $FEEDBACK_CALLBACK_TOKEN" \
                    -H 'Content-Type: application/json' \
                    -d "{\"eventId\":\"cb-phase-$PHASE-${{ github.run_id }}-${{ github.run_attempt }}\",\"type\":\"run.phase_changed\",\"provider\":\"codex\",\"payload\":{\"phase\":\"$PHASE\"}}" \
                    > /dev/null || true

            - name: Run Codex
              id: run_codex
              uses: openai/codex-action@52fe01ec70a42f454c9d2ebd47598f9fd6893d56
              with:
                  openai-api-key: ${{ secrets.CODEX_API_KEY }}
                  responses-api-endpoint: ${{ steps.payload.outputs.responsesEndpoint }}
                  model: ${{ vars.CODEX_MODEL || secrets.CODEX_MODEL }}
                  prompt-file: ${{ runner.temp }}/feedback-prompt.md
                  output-file: ${{ runner.temp }}/feedback-agent-final.md
                  codex-home: ${{ runner.temp }}/feedback-codex-home
                  permission-profile: ${{ steps.payload.outputs.permissionProfile }}
                  safety-strategy: drop-sudo

            # The same rule table `publish_candidate` uses, run *before* the
            # 26-minute verification sequence instead of after it. Run
            # 31322835665 spent its whole budget going green and was then thrown
            # away over one path; a change set that cannot ship should not buy
            # CI time first. This is a pre-flight only: it never grants
            # anything, and the authoritative gate still re-runs on the applied
            # patch in a job the Agent cannot reach. `continue-on-error` is
            # deliberate — failing the job here would strand the terminal
            # callback on "did not pass isolated verification" and hide which
            # path was rejected.
            - name: Pre-flight project diff gate
              id: preflight_gate
              continue-on-error: true
              env:
                  BASE_COMMIT: ${{ steps.base.outputs.sha }}
                  CONTRACT_RUN: ${{ steps.payload.outputs.contractRun }}
                  WRITE_ALLOWED: ${{ steps.payload.outputs.writeAllowed }}
                  TRUSTED_NODE: ${{ steps.trusted_tools.outputs.node }}
                  BASH_ENV: ''
                  ENV: ''
                  PATH: /usr/bin:/bin
              run: |
                  set -euo pipefail
                  export GIT_NO_REPLACE_OBJECTS=1
                  TRUSTED_GATE_ROOT="$(/usr/bin/mktemp -d "$RUNNER_TEMP/feedback-preflight-gate.XXXXXX")"
                  trap '/bin/rm -rf "$TRUSTED_GATE_ROOT"' EXIT
                  /bin/mkdir -p "$TRUSTED_GATE_ROOT/scripts" "$TRUSTED_GATE_ROOT/src/features/feedback"
                  /usr/bin/git show "$BASE_COMMIT:scripts/feedback-diff-gate.mjs" \
                    > "$TRUSTED_GATE_ROOT/scripts/feedback-diff-gate.mjs"
                  /usr/bin/git show "$BASE_COMMIT:src/features/feedback/diff-gate.js" \
                    > "$TRUSTED_GATE_ROOT/src/features/feedback/diff-gate.js"
                  /usr/bin/printf '{"type":"module"}\n' > "$TRUSTED_GATE_ROOT/package.json"
                  # Nothing is committed yet, so the change set has to be staged
                  # before the gate can see newly created files at all.
                  /usr/bin/git add -A -- . \
                    ':!doc/design/screenshots' \
                    ':!feedback-context.json' \
                    ':!feedback-diff-manifest.json' \
                    ':!callback.json'
                  "$TRUSTED_NODE" "$TRUSTED_GATE_ROOT/scripts/feedback-diff-gate.mjs" \
                    --base "$BASE_COMMIT" \
                    --staged \
                    --contract-run "$CONTRACT_RUN" \
                    --write-allowed "$WRITE_ALLOWED"

            # `phase: testing` is the one phase the reporter also sees: it moves
            # the Issue to `testing` (「验证中」), which is public, while the
            # phase events themselves stay internal per §10.2.
            - name: Report phase (testing)
              if: >-
                  steps.payload.outputs.writeAllowed == 'true' &&
                  steps.preflight_gate.outcome == 'success'
              env:
                  CALLBACK_URL: ${{ steps.payload.outputs.callbackUrl }}
                  TRUSTED_NODE: ${{ steps.trusted_tools.outputs.node }}
              run: |
                  set -euo pipefail
                  FEEDBACK_CALLBACK_TOKEN="$("$TRUSTED_NODE" -e 'const event = JSON.parse(require("fs").readFileSync(process.env.GITHUB_EVENT_PATH, "utf8")); process.stdout.write(JSON.parse(event.inputs.payload).callbackToken);')"
                  echo "::add-mask::$FEEDBACK_CALLBACK_TOKEN"
                  /usr/bin/curl --silent --show-error --max-time 10 \
                    -X POST "$CALLBACK_URL" \
                    -H "Authorization: Bearer $FEEDBACK_CALLBACK_TOKEN" \
                    -H 'Content-Type: application/json' \
                    -d "{\"eventId\":\"cb-phase-testing-${{ github.run_id }}-${{ github.run_attempt }}\",\"type\":\"run.phase_changed\",\"provider\":\"codex\",\"payload\":{\"phase\":\"testing\"}}" \
                    > /dev/null || true

            - name: Targeted tests
              id: tests
              if: >-
                  steps.payload.outputs.writeAllowed == 'true' &&
                  steps.preflight_gate.outcome == 'success'
              run: npm test

            - name: Build verification
              id: build
              if: >-
                  steps.payload.outputs.writeAllowed == 'true' &&
                  steps.preflight_gate.outcome == 'success'
              run: npm run build

            # The long pole: the E2E suite ran 21 minutes on run 31308373864.
            - name: Report phase (browser verification)
              if: >-
                  steps.payload.outputs.policy == 'implement_and_verify' &&
                  steps.preflight_gate.outcome == 'success'
              env:
                  CALLBACK_URL: ${{ steps.payload.outputs.callbackUrl }}
                  TRUSTED_NODE: ${{ steps.trusted_tools.outputs.node }}
              run: |
                  set -euo pipefail
                  FEEDBACK_CALLBACK_TOKEN="$("$TRUSTED_NODE" -e 'const event = JSON.parse(require("fs").readFileSync(process.env.GITHUB_EVENT_PATH, "utf8")); process.stdout.write(JSON.parse(event.inputs.payload).callbackToken);')"
                  echo "::add-mask::$FEEDBACK_CALLBACK_TOKEN"
                  /usr/bin/curl --silent --show-error --max-time 10 \
                    -X POST "$CALLBACK_URL" \
                    -H "Authorization: Bearer $FEEDBACK_CALLBACK_TOKEN" \
                    -H 'Content-Type: application/json' \
                    -d "{\"eventId\":\"cb-phase-e2e-${{ github.run_id }}-${{ github.run_attempt }}\",\"type\":\"run.phase_changed\",\"provider\":\"codex\",\"payload\":{\"phase\":\"browser_verification\"}}" \
                    > /dev/null || true

            - name: Playwright verification
              id: playwright
              if: >-
                  steps.payload.outputs.policy == 'implement_and_verify' &&
                  steps.preflight_gate.outcome == 'success'
              run: npm run test:e2e

            - name: Package untrusted Agent output
              id: package
              if: always() && steps.base.outcome == 'success'
              env:
                  BASE_COMMIT: ${{ steps.base.outputs.sha }}
                  TRUSTED_NODE: ${{ steps.trusted_tools.outputs.node }}
                  BASH_ENV: ''
                  ENV: ''
                  PATH: /usr/bin:/bin
              run: |
                  set -euo pipefail
                  OUTPUT_ROOT="$RUNNER_TEMP/feedback-agent-output"
                  /bin/rm -rf "$OUTPUT_ROOT"
                  /bin/mkdir -p "$OUTPUT_ROOT/evidence"
                  AGENT_MESSAGE_REASON=''
                  if [ -f "$RUNNER_TEMP/feedback-agent-final.md" ]; then
                    /bin/cp "$RUNNER_TEMP/feedback-agent-final.md" "$OUTPUT_ROOT/agent-final.txt"
                    if [ ! -s "$OUTPUT_ROOT/agent-final.txt" ]; then
                      AGENT_MESSAGE_REASON='empty_agent_message'
                    fi
                  else
                    : > "$OUTPUT_ROOT/agent-final.txt"
                    # Reporting a missing output file as "the Agent said nothing"
                    # would fail every Run with no way to tell why.
                    AGENT_MESSAGE_REASON='missing_output_file'
                    echo "::warning title=Codex output record::missing_output_file ($RUNNER_TEMP/feedback-agent-final.md)"
                  fi
                  /bin/echo -n "$AGENT_MESSAGE_REASON" > "$OUTPUT_ROOT/agent-final-reason.txt"
                  # `doc/design/screenshots` holds tracked documentation assets
                  # that `tests/e2e/ui_capture.spec.js` rewrites on every
                  # `npm run test:e2e`. Without this exclusion every
                  # implement_and_verify Candidate carried three unrelated PNGs
                  # — 581KB of the 582KB patch on run 31322835665.
                  /usr/bin/git add -A -- . \
                    ':!doc/design/screenshots' \
                    ':!feedback-context.json' \
                    ':!feedback-diff-manifest.json' \
                    ':!callback.json'
                  /usr/bin/git diff --cached --binary --full-index "$BASE_COMMIT" -- \
                    > "$OUTPUT_ROOT/candidate.patch"
                  TRUSTED_REPORTER_ROOT="$(/usr/bin/mktemp -d "$RUNNER_TEMP/feedback-callback-reporter.XXXXXX")"
                  /usr/bin/git show "$BASE_COMMIT:src/features/feedback/feedback-callback-reporter.js" \
                    > "$TRUSTED_REPORTER_ROOT/feedback-callback-reporter.mjs"
                  # Evidence is "PNGs written during this Run", so a root that
                  # some unrelated spec rewrites every time is not evidence.
                  # `doc/testdoc/screenshots`, `doc/design/screenshots` and
                  # `tests/e2e/screenshots` are all rewritten wholesale by
                  # ui_capture / ux-improvements / gantt-ui-excel on every
                  # `npm run test:e2e`, which is why run 31322835665 published a
                  # settings modal and two full-page captures for an Issue about
                  # the today marker. `tests/e2e/evidence` is written by nothing
                  # else, so whatever lands there was taken on purpose;
                  # `test-results` carries Playwright's own failure artifacts.
                  "$TRUSTED_NODE" "$TRUSTED_REPORTER_ROOT/feedback-callback-reporter.mjs" \
                    collect "$OUTPUT_ROOT/evidence" "$RUNNER_TEMP/feedback-evidence-start" \
                    tests/e2e/evidence test-results

            - name: Upload untrusted Agent output
              if: always() && steps.package.outcome == 'success'
              uses: actions/upload-artifact@v4
              with:
                  name: feedback-agent-output
                  path: ${{ runner.temp }}/feedback-agent-output/**
                  retention-days: 1
                  if-no-files-found: error

    publish_candidate:
        needs: agent
        if: always()
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - name: Resolve trusted tool paths
              id: trusted_tools
              run: echo "node=$(command -v node)" >> "$GITHUB_OUTPUT"

            - name: Validate dispatch payload
              id: payload
              env:
                  FEEDBACK_CALLBACK_ORIGIN: ${{ vars.FEEDBACK_CALLBACK_ORIGIN }}
                  TRUSTED_NODE: ${{ steps.trusted_tools.outputs.node }}
              run: |
                  set -euo pipefail
                  "$TRUSTED_NODE" - <<'NODE'
                    const fs = require("fs");
                    const event = JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, "utf8"));
                    const payload = JSON.parse(event.inputs?.payload || "");
                    const required = ["issueId", "runId", "policy", "provider", "contextToken", "callbackToken"];
                    for (const key of required) {
                      if (!payload[key]) throw new Error(`missing ${key}`);
                    }
                    if (payload.provider !== "codex") throw new Error("wrong provider for this workflow");
                    if (!/^run_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(payload.runId)) {
                      throw new Error("invalid runId");
                    }
                    const tokenPattern = /^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$/;
                    if (!tokenPattern.test(payload.contextToken) || !tokenPattern.test(payload.callbackToken)) {
                      throw new Error("invalid scoped token");
                    }
                    console.log(`::add-mask::${payload.contextToken}`);
                    console.log(`::add-mask::${payload.callbackToken}`);
                    const allowed = ["analyze", "implement", "implement_and_verify", "review"];
                    if (!allowed.includes(payload.policy)) throw new Error(`unroutable policy ${payload.policy}`);
                    const deliveryMode = payload.deliveryMode || "candidate_review";
                    if (!["auto_deliver", "candidate_review", "no_delivery"].includes(deliveryMode)) {
                      throw new Error("invalid deliveryMode");
                    }
                    const callbackOrigin = String(process.env.FEEDBACK_CALLBACK_ORIGIN || "").replace(/\/+$/, "");
                    const parsedOrigin = new URL(callbackOrigin);
                    if (parsedOrigin.protocol !== "https:" || parsedOrigin.origin !== callbackOrigin) {
                      throw new Error("invalid trusted callback origin");
                    }
                    const baseCommit = payload.baseCommit || "";
                    if (baseCommit && !/^[0-9a-f]{40,64}$/i.test(baseCommit)) throw new Error("invalid baseCommit");
                    const writeAllowed = ["implement", "implement_and_verify"].includes(payload.policy);
                    if (writeAllowed && !baseCommit) throw new Error("write policy requires baseCommit");
                    const encodedRunId = encodeURIComponent(payload.runId);
                    const out = {
                      runId: payload.runId,
                      policy: payload.policy,
                      callbackUrl: `${callbackOrigin}/api/feedback/runs/${encodedRunId}/events`,
                      baseCommit,
                      baseRef: process.env.GITHUB_REF_NAME || "master",
                      candidateRef: `feedback/candidate/${payload.runId}`,
                      writeAllowed,
                      contractRun: payload.contractRun === true,
                      // SCN-FWB-020: server-owned; the Runner never re-derives
                      // the §7.2 matrix for itself.
                      requiresDesign: payload.requiresDesign === true,
                    };
                    for (const [key, value] of Object.entries(out)) {
                      fs.appendFileSync(process.env.GITHUB_OUTPUT, `${key}=${value}\n`);
                    }
                  NODE

            - name: Checkout the pinned base commit
              uses: actions/checkout@v4
              with:
                  persist-credentials: false
                  fetch-depth: 0
                  ref: ${{ steps.payload.outputs.baseCommit || github.ref }}

            - name: Resolve base commit
              id: base
              run: echo "sha=$(/usr/bin/git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

            - name: Download untrusted Agent output
              id: artifact
              continue-on-error: true
              uses: actions/download-artifact@v4
              with:
                  name: feedback-agent-output
                  path: ${{ runner.temp }}/feedback-agent-output

            - name: Apply Candidate patch as data
              id: apply
              if: needs.agent.result == 'success' && steps.artifact.outcome == 'success'
              env:
                  BASE_COMMIT: ${{ steps.base.outputs.sha }}
                  PATCH_PATH: ${{ runner.temp }}/feedback-agent-output/candidate.patch
                  WRITE_ALLOWED: ${{ steps.payload.outputs.writeAllowed }}
                  BASH_ENV: ''
                  ENV: ''
                  PATH: /usr/bin:/bin
              run: |
                  set -euo pipefail
                  test -f "$PATCH_PATH"
                  test "$(/usr/bin/git rev-parse HEAD)" = "$BASE_COMMIT"
                  if [ -s "$PATCH_PATH" ]; then
                    /usr/bin/git apply --check --binary "$PATCH_PATH"
                    /usr/bin/git apply --index --binary "$PATCH_PATH"
                  fi
                  if [ "$WRITE_ALLOWED" = "true" ] && /usr/bin/git diff --cached --quiet; then
                    echo "Write-capable Run produced no Candidate changes" >&2
                    exit 1
                  fi

            - name: Create recoverable Candidate
              id: candidate
              if: steps.apply.outcome == 'success' && steps.payload.outputs.writeAllowed == 'true'
              env:
                  RUN_ID: ${{ steps.payload.outputs.runId }}
                  BASH_ENV: ''
                  ENV: ''
                  PATH: /usr/bin:/bin
              run: |
                  set -euo pipefail
                  /usr/bin/git config user.name "feedback-workbench[bot]"
                  /usr/bin/git config user.email "feedback-workbench[bot]@users.noreply.github.com"
                  /usr/bin/git -c core.hooksPath=/dev/null commit --no-verify \
                    -m "fix: candidate for feedback Run $RUN_ID"

            - name: Project diff gate
              id: gate
              if: >-
                  steps.apply.outcome == 'success' &&
                  (steps.payload.outputs.writeAllowed != 'true' || steps.candidate.outcome == 'success')
              env:
                  BASE_COMMIT: ${{ steps.base.outputs.sha }}
                  BASE_REF: ${{ steps.payload.outputs.baseRef }}
                  CANDIDATE_REF: ${{ steps.payload.outputs.candidateRef }}
                  CONTRACT_RUN: ${{ steps.payload.outputs.contractRun }}
                  WRITE_ALLOWED: ${{ steps.payload.outputs.writeAllowed }}
                  TRUSTED_NODE: ${{ steps.trusted_tools.outputs.node }}
                  BASH_ENV: ''
                  ENV: ''
                  PATH: /usr/bin:/bin
              run: |
                  set -euo pipefail
                  export GIT_NO_REPLACE_OBJECTS=1
                  TRUSTED_GATE_ROOT="$(/usr/bin/mktemp -d "$RUNNER_TEMP/feedback-diff-gate.XXXXXX")"
                  trap '/bin/rm -rf "$TRUSTED_GATE_ROOT"' EXIT
                  /bin/mkdir -p "$TRUSTED_GATE_ROOT/scripts" "$TRUSTED_GATE_ROOT/src/features/feedback"
                  /usr/bin/git show "$BASE_COMMIT:scripts/feedback-diff-gate.mjs" \
                    > "$TRUSTED_GATE_ROOT/scripts/feedback-diff-gate.mjs"
                  /usr/bin/git show "$BASE_COMMIT:src/features/feedback/diff-gate.js" \
                    > "$TRUSTED_GATE_ROOT/src/features/feedback/diff-gate.js"
                  /usr/bin/printf '{"type":"module"}\n' > "$TRUSTED_GATE_ROOT/package.json"
                  "$TRUSTED_NODE" "$TRUSTED_GATE_ROOT/scripts/feedback-diff-gate.mjs" \
                    --base "$BASE_COMMIT" \
                    --contract-run "$CONTRACT_RUN" \
                    --write-allowed "$WRITE_ALLOWED" \
                    --repository "$GITHUB_REPOSITORY" \
                    --base-ref "$BASE_REF" \
                    --candidate-ref "$CANDIDATE_REF" \
                    --out feedback-diff-manifest.json

            - name: Push immutable Candidate
              id: push
              if: steps.gate.outcome == 'success' && steps.payload.outputs.writeAllowed == 'true'
              env:
                  FEEDBACK_CANDIDATE_TOKEN: ${{ secrets.FEEDBACK_CANDIDATE_TOKEN }}
                  CANDIDATE_REF: ${{ steps.payload.outputs.candidateRef }}
                  BASH_ENV: ''
                  ENV: ''
                  PATH: /usr/bin:/bin
              run: |
                  set -euo pipefail
                  test -n "$FEEDBACK_CANDIDATE_TOKEN"
                  REMOTE_URL="https://x-access-token:${FEEDBACK_CANDIDATE_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
                  HEAD_COMMIT="$(/usr/bin/git rev-parse HEAD)"
                  REMOTE_LINE="$(/usr/bin/git ls-remote --heads "$REMOTE_URL" "refs/heads/$CANDIDATE_REF")"
                  REMOTE_COMMIT="${REMOTE_LINE%%[[:space:]]*}"
                  if [ -n "$REMOTE_COMMIT" ]; then
                    if [ "$REMOTE_COMMIT" = "$HEAD_COMMIT" ]; then
                      exit 0
                    fi
                    echo "Candidate ref already exists at a different commit" >&2
                    exit 1
                  fi
                  /usr/bin/git push --no-verify "$REMOTE_URL" "HEAD:refs/heads/$CANDIDATE_REF"

            - name: Upload evidence
              id: evidence
              if: steps.artifact.outcome == 'success' && steps.payload.outputs.policy == 'implement_and_verify'
              uses: actions/upload-artifact@v4
              with:
                  name: feedback-evidence-${{ steps.payload.outputs.runId }}
                  path: ${{ runner.temp }}/feedback-agent-output/evidence/**
                  retention-days: 7
                  if-no-files-found: ignore

            - name: Resolve trusted reporter
              id: reporter
              if: always() && steps.payload.outcome == 'success'
              continue-on-error: true
              env:
                  BASE_COMMIT: ${{ steps.base.outputs.sha }}
                  BASH_ENV: ''
                  ENV: ''
                  PATH: /usr/bin:/bin
              run: |
                  set -euo pipefail
                  TRUSTED_REPORTER_ROOT="$(/usr/bin/mktemp -d "$RUNNER_TEMP/feedback-callback-reporter.XXXXXX")"
                  TRUSTED_REPORTER="$TRUSTED_REPORTER_ROOT/feedback-callback-reporter.mjs"
                  /usr/bin/git show "$BASE_COMMIT:src/features/feedback/feedback-callback-reporter.js" \
                    > "$TRUSTED_REPORTER"
                  # SCN-FWB-020: the design extractor reads the Agent's own words,
                  # so it comes from the trusted base commit like the reporter.
                  TRUSTED_DESIGN="$TRUSTED_REPORTER_ROOT/feedback-extract-design.mjs"
                  /usr/bin/git show "$BASE_COMMIT:scripts/feedback-extract-design.mjs" \
                    > "$TRUSTED_DESIGN"
                  echo "path=$TRUSTED_REPORTER" >> "$GITHUB_OUTPUT"
                  echo "design=$TRUSTED_DESIGN" >> "$GITHUB_OUTPUT"

            - name: Report completion
              if: always() && steps.payload.outcome == 'success'
              env:
                  AGENT_RESULT: ${{ needs.agent.result }}
                  APPLY_OUTCOME: ${{ steps.apply.outcome }}
                  ARTIFACT_OUTCOME: ${{ steps.artifact.outcome }}
                  BASE_COMMIT: ${{ steps.base.outputs.sha }}
                  BUILD_OUTCOME: ${{ needs.agent.outputs.build_outcome }}
                  CALLBACK_URL: ${{ steps.payload.outputs.callbackUrl }}
                  EVIDENCE_URL: ${{ steps.evidence.outputs.artifact-url }}
                  GATE_OUTCOME: ${{ steps.gate.outcome }}
                  POLICY: ${{ steps.payload.outputs.policy }}
                  PLAYWRIGHT_OUTCOME: ${{ needs.agent.outputs.playwright_outcome }}
                  PUSH_OUTCOME: ${{ steps.push.outcome }}
                  REQUIRES_DESIGN: ${{ steps.payload.outputs.requiresDesign }}
                  TESTS_OUTCOME: ${{ needs.agent.outputs.targeted_tests_outcome }}
                  TRUSTED_DESIGN: ${{ steps.reporter.outputs.design }}
                  TRUSTED_NODE: ${{ steps.trusted_tools.outputs.node }}
                  TRUSTED_REPORTER: ${{ steps.reporter.outputs.path }}
                  WRITE_ALLOWED: ${{ steps.payload.outputs.writeAllowed }}
                  BASH_ENV: ''
                  ENV: ''
                  PATH: /usr/bin:/bin
              run: |
                  set -euo pipefail
                  FEEDBACK_CALLBACK_TOKEN="$("$TRUSTED_NODE" -e 'const event = JSON.parse(require("fs").readFileSync(process.env.GITHUB_EVENT_PATH, "utf8")); process.stdout.write(JSON.parse(event.inputs.payload).callbackToken);')"
                  echo "::add-mask::$FEEDBACK_CALLBACK_TOKEN"
                  if [ -n "$TRUSTED_REPORTER" ]; then
                    "$TRUSTED_NODE" "$TRUSTED_REPORTER" sanitize \
                      "$RUNNER_TEMP/feedback-agent-output/evidence"
                  else
                    echo "::warning title=Trusted reporter::unavailable; publishing the terminal callback only"
                  fi
                  # SCN-FWB-020: on an Issue that needs an approved design, the
                  # read-only deliverable IS the design. Extract it before the
                  # terminal is built so the Run can wait for a decision instead
                  # of completing into a dead end.
                  if [ "$REQUIRES_DESIGN" = "true" ] && [ "$WRITE_ALLOWED" != "true" ] \
                     && [ -n "$TRUSTED_DESIGN" ]; then
                    "$TRUSTED_NODE" "$TRUSTED_DESIGN" \
                      --message "$RUNNER_TEMP/feedback-agent-output/agent-final.txt" \
                      --out "$RUNNER_TEMP/feedback-design.json" || true
                  fi
                  "$TRUSTED_NODE" - <<'NODE'
                    const fs = require("fs");
                    const path = require("path");
                    // Evidence is only publishable once the trusted reporter has
                    // sanitized it, so without the reporter nothing is attached.
                    const evidencePublishable = Boolean(process.env.TRUSTED_REPORTER);
                    const readOutput = (name) => {
                      try {
                        return fs.readFileSync(
                          process.env.RUNNER_TEMP + "/feedback-agent-output/" + name,
                          "utf8"
                        ).trim();
                      } catch {
                        return "";
                      }
                    };
                    const agentMessage = readOutput("agent-final.txt").slice(0, 12000);
                    const agentMessageReason = readOutput("agent-final-reason.txt");
                    const writeAllowed = process.env.WRITE_ALLOWED === "true";
                    const playwrightRequired = process.env.POLICY === "implement_and_verify";
                    const agentPassed = process.env.AGENT_RESULT === "success";
                    const targetedTestsPassed = !writeAllowed || process.env.TESTS_OUTCOME === "success";
                    const buildPassed = !writeAllowed || process.env.BUILD_OUTCOME === "success";
                    const playwrightPassed = !playwrightRequired || process.env.PLAYWRIGHT_OUTCOME === "success";
                    const executionPassed = agentPassed &&
                      targetedTestsPassed &&
                      buildPassed &&
                      playwrightPassed &&
                      process.env.ARTIFACT_OUTCOME === "success" &&
                      process.env.APPLY_OUTCOME === "success" &&
                      process.env.GATE_OUTCOME === "success" &&
                      (!writeAllowed || process.env.PUSH_OUTCOME === "success");
                    let manifest = {};
                    try {
                      manifest = JSON.parse(fs.readFileSync("feedback-diff-manifest.json", "utf8"));
                    } catch {}
                    const evidenceRoot = process.env.RUNNER_TEMP + "/feedback-agent-output/evidence";
                    const contentTypes = new Map([[".png", "image/png"]]);
                    const visualEvidenceFiles = [];
                    const visit = (directory) => {
                      for (const entry of fs.readdirSync(directory, { withFileTypes: true })) {
                        const child = path.join(directory, entry.name);
                        if (entry.isDirectory()) visit(child);
                        else if (contentTypes.has(path.extname(entry.name).toLowerCase())) {
                          visualEvidenceFiles.push(child);
                        }
                      }
                    };
                    if (evidencePublishable && fs.existsSync(evidenceRoot)) visit(evidenceRoot);
                    visualEvidenceFiles.sort();
                    const hasVisualEvidence = visualEvidenceFiles.length > 0;
                    const visualEvidencePassed = manifest.visualEvidenceRequired !== true || hasVisualEvidence;
                    const success = executionPassed && visualEvidencePassed && Boolean(agentMessage);
                    const gateFailed = process.env.GATE_OUTCOME === "failure";
                    const emptyAgentResponse = !agentMessage;
                    const verificationReport = {
                      targetedTests: { command: "npm test", required: writeAllowed, passed: targetedTestsPassed },
                      build: { command: "npm run build", required: writeAllowed, passed: buildPassed },
                      playwright: { command: "npm run test:e2e", required: playwrightRequired, passed: playwrightPassed },
                      visualEvidence: {
                        required: manifest.visualEvidenceRequired === true,
                        present: hasVisualEvidence,
                      },
                    };
                    // SCN-FWB-020: a design proposal is a wait, not a completion.
                    // Only a successful read-only Run may switch the terminal, and
                    // only when the extractor validated the design the Worker will
                    // accept — a rejected design would lose the whole terminal.
                    let pendingDesign = null;
                    if (success && !writeAllowed && process.env.REQUIRES_DESIGN === "true") {
                      try {
                        const extracted = JSON.parse(
                          fs.readFileSync(process.env.RUNNER_TEMP + "/feedback-design.json", "utf8")
                        );
                        if (extracted.found && extracted.design) pendingDesign = extracted.design;
                        else console.log(`::warning title=Feedback design::${extracted.reason || "not produced"}`);
                      } catch {
                        console.log("::warning title=Feedback design::extractor produced no result");
                      }
                    }
                    const body = pendingDesign ? {
                      eventId: `cb-final-${process.env.GITHUB_RUN_ID}-${process.env.GITHUB_RUN_ATTEMPT}`,
                      type: "agent.waiting_human",
                      provider: "codex",
                      providerRawStatus: "success",
                      payload: {
                        actionType: "design_decision",
                        requestedAction: "已产出方案，请管理员确认：批准后才会进入代码实现，也可以要求修订或拒绝。",
                        summary: "已完成只读分析并产出方案，等待确认。",
                        design: pendingDesign,
                      },
                    } : {
                      eventId: `cb-final-${process.env.GITHUB_RUN_ID}-${process.env.GITHUB_RUN_ATTEMPT}`,
                      type: success ? "run.completed" : "run.failed",
                      provider: "codex",
                      providerRawStatus: success ? "success" : "failure",
                      payload: {
                        summary: success
                          ? writeAllowed
                            ? `已完成处理：修改 ${manifest.changedFiles?.length || 0} 个文件，并通过所有必需验证。`
                            // SCN-FWB-029: a read-only Run modifies nothing by
                            // design; reporting "0 files changed, all required
                            // verification passed" reads like a failed fix.
                            : "已完成只读分析：本次不修改仓库文件，结论见上一条处理结果。"
                          : emptyAgentResponse
                            ? agentMessageReason && agentMessageReason !== "empty_agent_message"
                              ? `无法读取 Agent 执行记录（${agentMessageReason}），本次没有可显示的处理结果。`
                              : "Agent 未返回可显示的处理结果。"
                          : gateFailed
                            ? "The Candidate was blocked by the trusted project diff gate."
                            : "The Run did not pass isolated verification or Candidate publication.",
                        errorCode: success
                          ? ""
                          : emptyAgentResponse
                            ? "empty_agent_response"
                            : gateFailed
                              ? "security_policy_violation"
                              : "verification_failed",
                        // §15.3: the workbench re-runs the same rule table on
                        // this payload. Without carrying the authorization the
                        // Runner's gate used, its re-check defaults both back to
                        // empty and rejects a Candidate the Runner just allowed.
                        contractRunApproved: manifest.contractRunApproved === true,
                        scnId: manifest.scnId || "",
                        diffManifest: manifest,
                        verification: verificationReport,
                      },
                    };
                    if (agentMessage) {
                      fs.writeFileSync("callback-agent.json", JSON.stringify({
                        eventId: `cb-agent-${process.env.GITHUB_RUN_ID}-${process.env.GITHUB_RUN_ATTEMPT}`,
                        type: "agent.message",
                        provider: "codex",
                        payload: { message: agentMessage },
                      }));
                    }
                    visualEvidenceFiles.forEach((file, index) => {
                      const extension = path.extname(file).toLowerCase();
                      const name = path.relative(evidenceRoot, file).split(path.sep).join("/");
                      fs.writeFileSync(`callback-artifact-${String(index).padStart(4, "0")}.json`, JSON.stringify({
                        eventId: `cb-visual-${process.env.GITHUB_RUN_ID}-${process.env.GITHUB_RUN_ATTEMPT}-${index}`,
                        type: "artifact.created",
                        provider: "codex",
                        payload: {
                          summary: `Fresh verification screenshot: ${name}`,
                          artifact: {
                            type: "visual-evidence",
                            name,
                            contentType: contentTypes.get(extension),
                            dataUrl: `data:${contentTypes.get(extension)};base64,${fs.readFileSync(file).toString("base64")}`,
                          },
                        },
                      }));
                    });
                    if (process.env.EVIDENCE_URL) {
                      fs.writeFileSync("callback-report.json", JSON.stringify({
                        eventId: `cb-evidence-${process.env.GITHUB_RUN_ID}-${process.env.GITHUB_RUN_ATTEMPT}`,
                        type: "artifact.created",
                        provider: "codex",
                        payload: {
                          summary: hasVisualEvidence ? "已保存验证截图与测试报告。" : "已保存测试报告。",
                          artifact: {
                            type: "verification-report",
                            name: hasVisualEvidence ? "验证截图与测试报告" : "测试报告",
                            url: process.env.EVIDENCE_URL,
                          },
                          verificationReport,
                        },
                      }));
                    }
                    fs.writeFileSync("callback.json", JSON.stringify(body));
                  NODE
                  DELIVERED=0
                  if [ -n "$TRUSTED_REPORTER" ]; then
                    if CALLBACK_URL="$CALLBACK_URL" \
                      FEEDBACK_CALLBACK_TOKEN="$FEEDBACK_CALLBACK_TOKEN" \
                      "$TRUSTED_NODE" "$TRUSTED_REPORTER" deliver .; then
                      DELIVERED=1
                    fi
                  fi
                  if [ "$DELIVERED" -eq 1 ]; then exit 0; fi
                  # LAST_RESORT_TERMINAL_DELIVERY: a Run with no terminal callback
                  # hangs until the wait expires, so the terminal goes out even when
                  # the reporter is missing or gave up. The Worker is idempotent on
                  # eventId, so a duplicate here is answered with 200.
                  CALLBACK_URL="$CALLBACK_URL" \
                    FEEDBACK_CALLBACK_TOKEN="$FEEDBACK_CALLBACK_TOKEN" \
                    "$TRUSTED_NODE" - <<'NODE'
                      const body = require("fs").readFileSync("callback.json", "utf8");
                      const send = async () => {
                        const response = await fetch(process.env.CALLBACK_URL, {
                          method: "POST",
                          headers: {
                            Authorization: `Bearer ${process.env.FEEDBACK_CALLBACK_TOKEN}`,
                            "Content-Type": "application/json",
                          },
                          body,
                          signal: AbortSignal.timeout(10_000),
                        });
                        return response.ok;
                      };
                      (async () => {
                        for (const delay of [0, 5_000, 15_000, 45_000]) {
                          if (delay) await new Promise((resume) => setTimeout(resume, delay));
                          try {
                            if (await send()) return;
                          } catch {}
                        }
                        process.exitCode = 1;
                      })();
                    NODE
